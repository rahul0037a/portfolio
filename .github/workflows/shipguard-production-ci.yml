# UNACTIVATED TEMPLATE for rahul0037a/portfolio. Independent prerequisite for
# the Vercel promotion gate; it runs candidate code WITHOUT ShipGuard secrets.
# package.json on main currently defines build as "tsc && vite build" and has
# no test/lint script. Add actual tests to this job when the project has them.
name: ShipGuard production CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ShipGuard production CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build the exact commit
        run: npm run build
